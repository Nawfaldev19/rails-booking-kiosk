name: Bug report
description: Something in Booking Kiosk does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For security problems, use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as Sam (member)
        2. Choose tomorrow
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API (Rails / GraphQL)
        - Member app
        - Kiosk app
        - Docker Compose / setup
        - Documentation
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, Node and Ruby versions, Postgres version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any personal data first.
      render: text
