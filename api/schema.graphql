  """
  One template per message kind. Managers only.
  """
  messageTemplates: [MessageTemplate!]!

  """
  The viewer's confirmed and cancelled bookings and open holds. Expired holds are left out. Members and managers.
  """
  myBookings(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int

    """
    True for future bookings (soonest first), false for past ones (latest first).
    """
    upcoming: Boolean = true
  ): BookingConnection!

  """
  The viewer's open holds, soonest slot first. Members and managers.
  """
  myHolds: [Booking!]!

  """
  Display name.
  """
  name: String!

  """
  Local opening time, HH:MM.
  """
  opensAt: String!

  """
  Recorded messages, newest first. Paged by (created_at, id), so new messages never shift a later page. Managers only.
  """
  outbox(
    """
    Returns the elements in the list that come after the specified cursor.
    """
    after: String

    """
    Returns the elements in the list that come before the specified cursor.
    """
    before: String

    """
    Returns the first _n_ elements from the list.
    """
    first: Int

    """
    Returns the last _n_ elements from the list.
    """
    last: Int
  ): OutboundMessageConnection!

  """
  URL-safe identifier used in `/w/:slug`.
  """
  slug: String!

  """
  Staff and managers, including invited people who have not chosen a password yet. Managers only.
  """
  team: [StaffMember!]!

  """
  IANA time zone used for opening hours and day boundaries.
  """
  timeZone: String!

  """
  Today's date in the workspace's time zone.
  """
  today: ISO8601Date!

  """
  Confirmed hours per machine in service over the last 14 days. Managers only.
  """
  utilisation: [MachineUsage!]!

  """
  The viewer's role in this workspace.
  """
  viewerRole: Role!
}

"""
Public facts about a workspace the viewer belongs to.
"""
type WorkspaceSummary {
  """
  Display name.
  """
  name: String!

  """
  URL-safe identifier used in `/w/:slug` and `workspace(slug:)`.
  """
  slug: String!
}
