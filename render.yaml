# Render Blueprint: a free Rails API, a free Postgres database and two free static sites
# (the member app and the front-desk kiosk). Steps are in DEPLOY.md. Nothing here is
# deployed until you connect the repo on Render.
#
# The apps expect /graphql on their own origin (the session cookie stays first-party),
# which Vite's proxy provides in development. Here each static site rewrites /graphql
# to the API instead.
databases:
  - name: booking-kiosk-db
    plan: free
    databaseName: booking_kiosk_production
    user: booking_kiosk

services:
  - type: web
    name: booking-kiosk-api
    runtime: ruby
    plan: free
    rootDir: api
    buildCommand: bundle install
    # db:prepare runs migrations; the seed runs only while the database has no workspace.
    startCommand: >-
      bin/rails db:prepare &&
      (bin/rails runner 'exit(Workspace.exists? ? 0 : 1)' || bin/rails db:seed) &&
      bin/rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RUBY_VERSION
        value: 3.4.11
      - key: DATABASE_URL
        fromDatabase:
          name: booking-kiosk-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # Invitation mail is written to tmp/mails instead of sent (no SMTP server on the free demo).
      - key: MAIL_DELIVERY
        value: file
      # Only these browser origins may call /graphql. Replace if Render adds a suffix to the site names.
      - key: ALLOWED_ORIGINS
        value: https://booking-kiosk-member.onrender.com,https://booking-kiosk-desk.onrender.com
      - key: MEMBER_APP_URL
        value: https://booking-kiosk-member.onrender.com
      - key: APP_HOST
        value: booking-kiosk-member.onrender.com

  - type: web
    name: booking-kiosk-member
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build --workspace @booking-kiosk/member
    staticPublishPath: apps/member/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /graphql
        destination: https://booking-kiosk-api.onrender.com/graphql
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  - type: web
    name: booking-kiosk-desk
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build --workspace @booking-kiosk/kiosk
    staticPublishPath: apps/kiosk/dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /graphql
        destination: https://booking-kiosk-api.onrender.com/graphql
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
